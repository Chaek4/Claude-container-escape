name: APK Dynamic Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark tcpdump

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            "platforms;android-30"
          echo "yes" | sdkmanager --licenses

      - name: Run emulator + APK analysis
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: |
            set -e
            echo "=== Emulator ready ==="
            adb devices

            # Запускаем перехват трафика
            sudo tcpdump -i any -w /tmp/capture.pcap &
            TCPDUMP_PID=$!

            # Очищаем logcat
            adb logcat -c

            # Устанавливаем APK
            echo "=== Installing APK ==="
            adb install -r base.apk
            echo "APK installed"

            # Получаем package name
            PACKAGE=$(adb shell pm list packages | grep lostbot | sed 's/package://' | tr -d '\r\n')
            echo "Package: [$PACKAGE]"

            # Получаем главный Activity
            ACTIVITY=$(adb shell cmd package resolve-activity --brief "$PACKAGE" 2>/dev/null | tail -1 | tr -d '\r\n')
            echo "Activity: [$ACTIVITY]"

            # Запускаем приложение через am start
            echo "=== Launching app ==="
            adb shell am start -n "$ACTIVITY" || \
            adb shell am start -a android.intent.action.MAIN -c android.intent.category.LAUNCHER "$PACKAGE"

            sleep 10

            # Скриншот после запуска
            adb shell screencap -p /sdcard/screen1.png
            adb pull /sdcard/screen1.png /tmp/screen1.png || true

            # Ждём ещё — даём приложению поработать
            echo "Waiting 40s for app activity..."
            sleep 40

            # Второй скриншот
            adb shell screencap -p /sdcard/screen2.png
            adb pull /sdcard/screen2.png /tmp/screen2.png || true

            echo "=== Granted permissions ==="
            adb shell dumpsys package "$PACKAGE" | grep "granted=true"

            echo "=== Active network connections ==="
            adb shell netstat 2>/dev/null | head -40 || true

            echo "=== App files ==="
            adb root && sleep 2 || true
            adb shell ls -la /data/data/"$PACKAGE"/ 2>/dev/null || true

            echo "=== Shared preferences ==="
            for f in $(adb shell ls /data/data/"$PACKAGE"/shared_prefs/ 2>/dev/null | tr -d '\r'); do
              echo "--- $f ---"
              adb shell cat "/data/data/$PACKAGE/shared_prefs/$f" 2>/dev/null || true
            done

            echo "=== LOGCAT app ==="
            adb logcat -d | grep -iE "lostbot|urent|mqtt|spam|unlock|bluetooth|ble|telegram|token" | head -300

            echo "=== LOGCAT network ==="
            adb logcat -d | grep -iE "connect|socket|http|mqtt|network|IOException|Exception" \
              | grep -vE "Zygote|art |dalvik|HealthConnect|wificond" | head -150

            # Останавливаем tcpdump
            sudo kill $TCPDUMP_PID 2>/dev/null || true
            sleep 3

            echo "=== Unique destination IPs ==="
            sudo tshark -r /tmp/capture.pcap -T fields -e ip.dst 2>/dev/null \
              | sort -u | grep -v '^$' | head -40

            echo "=== DNS queries ==="
            sudo tshark -r /tmp/capture.pcap -Y "dns.flags.response == 0" \
              -T fields -e dns.qry.name 2>/dev/null | sort -u | head -30

            echo "=== MQTT port 1883 ==="
            sudo tshark -r /tmp/capture.pcap -Y "tcp.port == 1883" 2>/dev/null | head -20

            echo "=== HTTP requests ==="
            sudo tshark -r /tmp/capture.pcap -Y "http.request" \
              -T fields -e ip.dst -e http.host -e http.request.uri 2>/dev/null | head -20

            echo "=== DONE ==="

      - name: Save logcat
        if: always()
        run: |
          adb logcat -d > /tmp/logcat_full.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-analysis-results
          path: |
            /tmp/capture.pcap
            /tmp/screen1.png
            /tmp/screen2.png
            /tmp/logcat_full.txt
          retention-days: 7
