name: APK Dynamic Analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark tcpdump

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            "platforms;android-30"
          echo "yes" | sdkmanager --licenses

      - name: Run emulator + APK analysis
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: bash analyze.sh

      - name: Commit results to repo
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          mkdir -p results
          cp /tmp/analysis.txt results/analysis.txt 2>/dev/null || echo "No analysis.txt" > results/analysis.txt
          cp /tmp/logcat_full.txt results/logcat_full.txt 2>/dev/null || echo "No logcat" > results/logcat_full.txt
          cp /tmp/screen1.png results/screen1.png 2>/dev/null || true
          cp /tmp/screen2.png results/screen2.png 2>/dev/null || true

          git add results/
          git diff --staged --quiet || git commit -m "Add analysis results"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
