name: APK Dynamic Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tshark & tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark tcpdump netcat-openbsd

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;google_apis;x86_64" \
            "platforms;android-30"
          echo "yes" | sdkmanager --licenses

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            --name "test_avd" \
            --package "system-images;android-30;google_apis;x86_64" \
            --device "pixel_4" \
            --force

      - name: Run emulator + APK analysis
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: test_avd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          script: |
            echo "=== Emulator is ready ==="
            adb devices

            # Запускаем перехват трафика
            sudo tcpdump -i any -w /tmp/capture.pcap &
            TCPDUMP_PID=$!
            echo "tcpdump PID: $TCPDUMP_PID"

            # Очищаем logcat
            adb logcat -c

            # Устанавливаем APK
            echo "=== Installing APK ==="
            adb install -r base.apk
            echo "APK installed"

            # Получаем package name
            PACKAGE=$(adb shell pm list packages | grep lostbot | sed 's/package://' | tr -d '\r')
            echo "Package: $PACKAGE"

            # Запускаем приложение
            echo "=== Launching app ==="
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 10

            # Скриншот сразу после запуска
            adb shell screencap -p /sdcard/screen1.png
            adb pull /sdcard/screen1.png /tmp/screen1.png

            # Ждём ещё — даём приложению поработать
            sleep 30

            # Второй скриншот
            adb shell screencap -p /sdcard/screen2.png
            adb pull /sdcard/screen2.png /tmp/screen2.png

            echo "=== App info ==="
            adb shell dumpsys package "$PACKAGE" | grep -E 'versionName|versionCode|firstInstall|lastUpdate|granted=true'

            echo "=== Active network connections from emulator ==="
            adb shell netstat -tuln 2>/dev/null || true

            echo "=== Processes ==="
            adb shell ps | grep "$PACKAGE" || true

            echo "=== App data files ==="
            adb root || true
            sleep 2
            adb shell ls -la /data/data/"$PACKAGE"/ 2>/dev/null || true
            adb shell ls -la /data/data/"$PACKAGE"/shared_prefs/ 2>/dev/null || true

            echo "=== Shared preferences content ==="
            adb shell find /data/data/"$PACKAGE"/shared_prefs/ -name "*.xml" 2>/dev/null | while read f; do
              echo "--- $f ---"
              adb shell cat "$f" 2>/dev/null || true
            done

            echo "=== Databases ==="
            adb shell find /data/data/"$PACKAGE"/databases/ -type f 2>/dev/null || true

            echo "=== Logcat (app specific) ==="
            adb logcat -d | grep -i "lostbot\|urent\|mqtt\|spam\|unlock\|bluetooth\|ble\|telegram" | head -300

            echo "=== Logcat (network) ==="
            adb logcat -d | grep -iE "connect|socket|http|mqtt|network|error|exception" | grep -v "Zygote\|art\|dalvik" | head -200

            # Останавливаем tcpdump
            sudo kill $TCPDUMP_PID 2>/dev/null || true
            sleep 3

            echo "=== Traffic analysis ==="
            sudo tshark -r /tmp/capture.pcap -T fields \
              -e ip.dst -e ip.src -e tcp.dstport -e udp.dstport \
              2>/dev/null | sort -u | grep -v '^$' | head -50

            echo "=== DNS queries ==="
            sudo tshark -r /tmp/capture.pcap -Y "dns.flags.response == 0" \
              -T fields -e dns.qry.name 2>/dev/null | sort -u | head -30

            echo "=== MQTT traffic (port 1883) ==="
            sudo tshark -r /tmp/capture.pcap -Y "tcp.port == 1883" 2>/dev/null | head -30

            echo "=== HTTP requests ==="
            sudo tshark -r /tmp/capture.pcap -Y "http.request" \
              -T fields -e ip.dst -e http.host -e http.request.uri 2>/dev/null | head -30

            echo "=== DONE ==="

      - name: Save full logcat
        if: always()
        run: |
          adb logcat -d > /tmp/logcat_full.txt 2>/dev/null || true
          adb logcat -d | grep -i "lostbot\|urent\|mqtt\|spam\|unlock" > /tmp/logcat_app.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-analysis-results
          path: |
            /tmp/capture.pcap
            /tmp/screen1.png
            /tmp/screen2.png
            /tmp/logcat_full.txt
            /tmp/logcat_app.txt
          retention-days: 7
